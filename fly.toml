# fly.toml app configuration file generated for hello-fly-qoqs7q on 2026-11-21T06:02:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'hello-fly-qoqs7q'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
